<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Descargar auditoría RUANA — Captación territorial</title>
  <style>
    :root { --bg: #0f1419; --card: #1a2332; --accent: #c9a227; --text: #e8ecf1; --muted: #94a3b8; }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid rgba(201, 162, 39, 0.35);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { font-size: 1.35rem; margin: 0 0 8px; color: var(--accent); }
    p { color: var(--muted); line-height: 1.55; margin: 0 0 24px; font-size: 0.95rem; }
    a.btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      margin-bottom: 12px;
      transition: transform 0.15s, opacity 0.15s;
    }
    a.btn:hover { transform: translateY(-1px); opacity: 0.92; }
    .pdf { background: #dc2626; color: #fff; }
    .word { background: #2563eb; color: #fff; }
    .md { background: #334155; color: #fff; }
    .hint { font-size: 0.8rem; color: var(--muted); margin-top: 20px; border-top: 1px solid #334155; padding-top: 16px; }
    code { background: #0f1419; padding: 2px 6px; border-radius: 4px; font-size: 0.85em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Auditoría técnica RUANA</h1>
    <p>Captación y organización territorial — 5 de agosto de 2026. Elige el formato que prefieras:</p>

    <a class="btn pdf" href="AUDITORIA_CAPTACION_TERRITORIAL_RUANA.pdf" download>
      Descargar PDF
    </a>
    <a class="btn word" href="AUDITORIA_CAPTACION_TERRITORIAL_RUANA.docx" download>
      Descargar Word (.docx)
    </a>
    <a class="btn md" href="AUDITORIA_CAPTACION_TERRITORIAL_RUANA.md" download>
      Descargar Markdown (.md)
    </a>

    <p class="hint">
      También en la raíz del proyecto:<br />
      <code>AUDITORIA_CAPTACION_TERRITORIAL_RUANA.pdf</code><br />
      <code>AUDITORIA_CAPTACION_TERRITORIAL_RUANA.docx</code>
    </p>
  </div>
</body>
</html>
