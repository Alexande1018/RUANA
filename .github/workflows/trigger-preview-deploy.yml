name: Trigger preview deploy

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dispatch-preview:
    name: Solicitar despliegue preview
    runs-on: ubuntu-latest
    steps:
      - name: Disparar despliegue preview en main
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-preview-dev',
              client_payload: {
                sha: context.sha,
                ref: context.ref,
              },
            });

            core.summary
              .addHeading('Preview solicitado')
              .addRaw(`Se envió \`repository_dispatch\` para desplegar \`${context.sha}\` desde \`dev\`.`)
              .addRaw('Revisa el workflow **Deploy preview (dev)** en la rama `main`.')
              .write();
