name: Security ops (RLS + alerta GCP)

on:
  push:
    branches:
      - main
    paths:
      - .github/scripts/apply_rls_migration.py
      - .github/scripts/grant-deployer-monitoring-roles.sh
      - .github/workflows/security-ops.yml
      - supabase/migrations/20260902000200_enable_rls_public_tables.sql
  workflow_dispatch:
    inputs:
      dry_run_rls:
        description: Solo diagnosticar RLS, no aplicar migración
        required: false
        type: boolean
        default: false
      skip_iam:
        description: Omitir concesión de roles IAM al deployer
        required: false
        type: boolean
        default: false
      skip_rls:
        description: Omitir migración RLS
        required: false
        type: boolean
        default: false
      skip_alert:
        description: Omitir upsert de alerta Monitoring
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ruana-4293f

jobs:
  security-ops:
    name: RLS Supabase + IAM Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Conceder roles Monitoring al deployer
        if: ${{ !inputs.skip_iam }}
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: bash .github/scripts/grant-deployer-monitoring-roles.sh

      - name: Instalar psycopg
        if: ${{ !inputs.skip_rls }}
        run: python3 -m pip install --quiet psycopg[binary]

      - name: Aplicar migración RLS en Supabase
        if: ${{ !inputs.skip_rls }}
        env:
          RLS_DRY_RUN: ${{ inputs.dry_run_rls && '1' || '0' }}
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=ruana-database-url --project="$PROJECT_ID")"
          python3 .github/scripts/apply_rls_migration.py | tee rls-report.txt

      - name: Crear/actualizar alerta init Postgres
        if: ${{ !inputs.skip_alert }}
        env:
          PROJECT_ID: ${{ env.PROJECT_ID }}
        run: bash .github/scripts/upsert-postgres-schema-init-alert.sh

      - name: Verificar health producción
        run: |
          set -euo pipefail
          for url in \
            "https://ruana-288784334163.europe-west1.run.app/api/health" \
            "https://ruana-4293f.web.app/api/health"; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$url")"
            echo "$url -> HTTP $code"
            test "$code" = "200"
          done
