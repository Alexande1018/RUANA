name: Deploy preview (dev)

on:
  repository_dispatch:
    types:
      - deploy-preview-dev
  workflow_dispatch:
    inputs:
      dev_sha:
        description: Commit SHA de dev a desplegar (vacío = último commit de dev)
        required: false
        default: ""

concurrency:
  group: firebase-preview-dev
  cancel-in-progress: true

env:
  PROJECT_ID: ruana-4293f
  REGION: europe-west1
  SERVICE: ruana-preview
  REPOSITORY: ruana
  RUNTIME_SERVICE_ACCOUNT: ruana-runner@ruana-4293f.iam.gserviceaccount.com
  SUPABASE_URL: https://qqlxgwbmtzcfrrobrfzy.supabase.co

jobs:
  deploy-preview:
    name: Build and deploy preview service
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out dev revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.client_payload.sha || inputs.dev_sha || 'dev' }}
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Sync SMTP password to Secret Manager
        env:
          SMTP_PASSWORD: ${{ secrets.RUANA_SMTP_PASSWORD }}
        run: bash .github/scripts/sync-smtp-password-gcp.sh

      - name: Sync admin credentials to Secret Manager
        env:
          ADMIN_CREDENTIALS_JSON: ${{ secrets.RUANA_ADMIN_CREDENTIALS_JSON }}
          FORCE_ADMIN_CREDENTIALS_SYNC: "false"
        run: bash .github/scripts/sync-admin-credentials-gcp.sh

      - name: Sync Stripe secrets to Secret Manager
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: bash .github/scripts/sync-stripe-secrets-gcp.sh

      - name: Build and push container image
        run: |
          DEPLOY_SHA=$(git rev-parse HEAD)
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${DEPLOY_SHA}"
          echo "DEPLOY_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run preview service
        id: preview
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --max-instances 3 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_REGION=$REGION,SUPABASE_URL=$SUPABASE_URL,RUANA_STRIPE_PAYMENTS_ENABLED=1,STRIPE_API_VERSION=2024-11-20.acacia" \
            --set-secrets "DATABASE_URL=ruana-database-url:latest,SUPABASE_SERVICE_ROLE_KEY=ruana-supabase-service-role-key:latest,SUPABASE_ANON_KEY=ruana-supabase-anon-key:latest,FLASK_SECRET_KEY=ruana-flask-secret-key:latest,RUANA_ADMIN_CREDENTIALS_JSON=ruana-admin-credentials:latest,RUANA_SMTP_PASSWORD=ruana-smtp-password:latest,STRIPE_SECRET_KEY=ruana-stripe-secret-key:latest,STRIPE_PUBLISHABLE_KEY=ruana-stripe-publishable-key:latest,STRIPE_WEBHOOK_SECRET=ruana-stripe-webhook-secret:latest"

          PREVIEW_URL=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)')
          REVISION=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.latestReadyRevisionName)')

          echo "url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_REVISION=${REVISION}" >> "$GITHUB_ENV"
          echo "Preview URL: ${PREVIEW_URL}"
          echo "Preview revision: ${REVISION}"

      - name: Verify preview runtime
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          curl --fail --retry 8 --retry-delay 6 "$PREVIEW_URL/api/health"
          curl --fail --retry 8 --retry-delay 6 "$PREVIEW_URL/api/contactos/metricas"
          curl --fail --retry 8 --retry-delay 6 "$PREVIEW_URL/" | grep -q 'ruana-brand-mark'
          {
            echo "## Preview (dev)"
            echo
            echo "- URL: $PREVIEW_URL"
            echo "- Commit desplegado: \`$DEPLOY_SHA\`"
            echo "- Revisión Cloud Run: \`$PREVIEW_REVISION\`"
            echo
            echo "Producción (\`https://ruana-4293f.web.app\`) no se modifica."
          } >> "$GITHUB_STEP_SUMMARY"
