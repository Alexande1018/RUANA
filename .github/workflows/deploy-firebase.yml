name: Deploy to Firebase

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_admin_credentials_sync:
        description: Sobrescribir Secret Manager con el GitHub Secret RUANA_ADMIN_CREDENTIALS_JSON
        required: false
        type: boolean
        default: false
      ruana_stripe_mode:
        description: Modo Stripe (test|live). Debe coincidir con STRIPE_SECRET_KEY en GitHub Secrets.
        required: false
        type: choice
        default: test
        options:
          - test
          - live

concurrency:
  group: firebase-production
  cancel-in-progress: false

env:
  PROJECT_ID: ruana-4293f
  REGION: europe-west1
  SERVICE: ruana
  REPOSITORY: ruana
  RUNTIME_SERVICE_ACCOUNT: ruana-runner@ruana-4293f.iam.gserviceaccount.com
  SUPABASE_URL: https://qqlxgwbmtzcfrrobrfzy.supabase.co
  FIREBASE_HOSTING_URL: https://ruana-4293f.web.app

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Firebase CLI
        run: npm ci --no-audit --no-fund

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Sync admin credentials to Secret Manager
        env:
          ADMIN_CREDENTIALS_JSON: ${{ secrets.RUANA_ADMIN_CREDENTIALS_JSON }}
          FORCE_ADMIN_CREDENTIALS_SYNC: ${{ github.event.inputs.force_admin_credentials_sync || 'false' }}
        run: bash .github/scripts/sync-admin-credentials-gcp.sh

      - name: Sync SMTP password to Secret Manager
        env:
          SMTP_PASSWORD: ${{ secrets.RUANA_SMTP_PASSWORD }}
        run: bash .github/scripts/sync-smtp-password-gcp.sh

      - name: Sync Stripe secrets to Secret Manager
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: bash .github/scripts/sync-stripe-secrets-gcp.sh

      - name: Resolver modo Stripe
        id: stripe_mode
        env:
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ruana_stripe_mode || '' }}
          VARS_MODE: ${{ vars.RUANA_STRIPE_MODE }}
          RUANA_STRIPE_ALLOW_LIVE_PUSH: ${{ vars.RUANA_STRIPE_ALLOW_LIVE_PUSH }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bash .github/scripts/resolve-stripe-mode.sh "${{ github.event_name }}" "$INPUT_MODE" "$VARS_MODE"

      - name: Validar coherencia modo Stripe / clave
        env:
          RUANA_STRIPE_MODE: ${{ steps.stripe_mode.outputs.mode }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: bash .github/scripts/validate-stripe-deploy-mode.sh

      - name: Sync cron secret to Secret Manager
        env:
          RUANA_CRON_SECRET: ${{ secrets.RUANA_CRON_SECRET }}
        run: bash .github/scripts/sync-cron-secret-gcp.sh

      - name: Build and push container image
        run: |
          DEPLOY_SHA=$(git rev-parse HEAD)
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${DEPLOY_SHA}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --allow-unauthenticated \
            --max-instances 3 \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --set-env-vars "FIREBASE_PROJECT_ID=$PROJECT_ID,GOOGLE_CLOUD_REGION=$REGION,SUPABASE_URL=$SUPABASE_URL,RUANA_PUBLIC_APP_URL=$FIREBASE_HOSTING_URL,RUANA_STRIPE_PAYMENTS_ENABLED=1,STRIPE_API_VERSION=2024-11-20.acacia,RUANA_ENV=production,RUANA_STRIPE_MODE=${{ steps.stripe_mode.outputs.mode }},RUANA_SESSION_COOKIE_SECURE=true,RUANA_SCHEDULER_SA=ruana-scheduler-invoker@ruana-4293f.iam.gserviceaccount.com" \
            --set-secrets "DATABASE_URL=ruana-database-url:latest,SUPABASE_SERVICE_ROLE_KEY=ruana-supabase-service-role-key:latest,SUPABASE_ANON_KEY=ruana-supabase-anon-key:latest,FLASK_SECRET_KEY=ruana-flask-secret-key:latest,RUANA_ADMIN_CREDENTIALS_JSON=ruana-admin-credentials:latest,RUANA_SMTP_PASSWORD=ruana-smtp-password:latest,STRIPE_SECRET_KEY=ruana-stripe-secret-key:latest,STRIPE_PUBLISHABLE_KEY=ruana-stripe-publishable-key:latest,STRIPE_WEBHOOK_SECRET=ruana-stripe-webhook-secret:latest,RUANA_CRON_SECRET=ruana-cron-secret:latest"

      - name: Deploy Firebase Hosting
        run: npx firebase-tools@15.18.0 deploy --project "$PROJECT_ID" --only hosting --non-interactive

      - name: Verify public runtime
        env:
          CLOUD_RUN_URL: https://ruana-288784334163.europe-west1.run.app
        run: |
          set -euo pipefail
          check_health() {
            local name="$1"
            local url="$2"
            local last_code="000"
            local i
            for i in 1 2 3; do
              last_code="$(curl -sS -o /tmp/ruana-health.json -w "%{http_code}" --max-time 20 "$url" || echo "000")"
              if [[ "$last_code" == "200" ]]; then
                echo "OK $name health HTTP 200"
                return 0
              fi
              if [[ "$last_code" == "429" ]]; then
                echo "::warning::$name health HTTP 429 (rate limit). El despliegue ya terminó; no se trata como fallo de Cloud Run/Firebase."
                sleep 8
                continue
              fi
              echo "$name health HTTP $last_code (intento $i)"
              sleep 5
            done
            if [[ "$last_code" == "429" ]]; then
              echo "::warning::$name verificación inconclusa por 429. No se marca el deploy como fallido."
              return 0
            fi
            echo "::error::$name health falló con HTTP $last_code"
            return 1
          }
          check_health "Cloud Run" "$CLOUD_RUN_URL/api/health"
          check_health "Firebase Hosting" "$FIREBASE_HOSTING_URL/api/health"
          fetch_and_grep() {
            local url="$1"
            local pattern="$2"
            local outfile="/tmp/ruana-verify-$$.html"
            curl --fail --retry 3 --retry-delay 5 --retry-all-errors -sS -o "$outfile" --max-time 30 "$url"
            grep -q "$pattern" "$outfile"
          }
          fetch_and_grep "$FIREBASE_HOSTING_URL/aliado" "input-foto-perfil"
          fetch_and_grep "$FIREBASE_HOSTING_URL/" "ruana-brand-mark"

      - name: Upsert alerta init esquema Postgres
        run: bash .github/scripts/upsert-postgres-schema-init-alert.sh
