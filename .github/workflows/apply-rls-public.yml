name: Aplicar RLS public (anon key)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - supabase/migrations/20260902000200_enable_rls_public_tables.sql
      - .github/scripts/apply_rls_public_tables.py
      - .github/workflows/apply-rls-public.yml

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ruana-4293f

jobs:
  apply-rls:
    name: Activar RLS en tablas public
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Instalar psycopg
        run: python3 -m pip install --quiet psycopg[binary]

      - name: Aplicar migración RLS
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=ruana-database-url --project="$PROJECT_ID")"
          python3 .github/scripts/apply_rls_public_tables.py
