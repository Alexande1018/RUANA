name: Fix financial_transfers SERIAL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/scripts/encargo_72_ops.py
      - .github/scripts/fix_financial_transfers_serial.py
      - .github/workflows/fix-financial-transfers-serial.yml

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ruana-4293f

jobs:
  fix-serial:
    name: Reparar SERIAL en Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Instalar psycopg
        run: python3 -m pip install --quiet psycopg[binary]

      - name: Diagnóstico y resync encargo #72
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=ruana-database-url --project="$PROJECT_ID")"
          python3 .github/scripts/encargo_72_ops.py | tee encargo-72-report.txt

      - name: Ejecutar SQL en Postgres (Supabase)
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=ruana-database-url --project="$PROJECT_ID")"
          python3 .github/scripts/fix_financial_transfers_serial.py
