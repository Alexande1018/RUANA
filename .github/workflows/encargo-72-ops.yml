name: Encargo 72 ops

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Solo diagnóstico, sin UPDATE
        type: boolean
        default: false
  push:
    branches:
      - cursor/encargo-72-ops-7681

permissions:
  id-token: write
  contents: read

env:
  PROJECT_ID: ruana-4293f

jobs:
  encargo-72:
    name: Diagnóstico y resync encargo #72
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/288784334163/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: ruana-firebase-deployer@ruana-4293f.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Instalar psycopg
        run: python3 -m pip install --quiet psycopg[binary]

      - name: Ejecutar diagnóstico y resync
        env:
          ENCARGO_72_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
          ENCARGO_72_ALLOW_RESYNC: "1"
        run: |
          export DATABASE_URL="$(gcloud secrets versions access latest --secret=ruana-database-url --project="$PROJECT_ID")"
          python3 .github/scripts/encargo_72_ops.py | tee encargo-72-report.txt

      - name: Subir informe
        uses: actions/upload-artifact@v4
        with:
          name: encargo-72-report
          path: encargo-72-report.txt
