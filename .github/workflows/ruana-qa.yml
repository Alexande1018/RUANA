name: RUANA QA manual

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ruana-qa-latest
  cancel-in-progress: true

jobs:
  qa:
    name: Ejecutar pruebas RUANA
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CI: "true"
      FLASK_SECRET_KEY: ruana_qa_secret_key
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
      DATABASE_URL: ""
      SUPABASE_URL: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      RUANA_DB_PATH: ${{ github.workspace }}/qa-artifacts/ruana-e2e-github.db
      RUANA_QA_VIDEO_PAUSE_MS: "1500"
      RUANA_QA_ACTION_PAUSE_MS: "800"

    steps:
      - name: Descargar rama seleccionada
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: RUANA/web/requirements-dev.txt

      - name: Instalar dependencias JavaScript
        run: npm ci

      - name: Instalar navegador Playwright
        run: npx playwright install --with-deps chromium

      - name: Instalar dependencias Python
        run: python -m pip install -r RUANA/web/requirements-dev.txt

      - name: Limpiar artefactos locales de esta ejecucion
        run: |
          rm -rf qa-artifacts
          mkdir -p qa-artifacts/results

      - name: Ejecutar contratos y tests backend
        shell: bash
        run: |
          set -o pipefail
          python -m pytest RUANA/tests -q | tee qa-artifacts/results/pytest.log

      - name: Ejecutar E2E con video y reporte HTML
        shell: bash
        run: |
          set -o pipefail
          npm run qa:e2e | tee qa-artifacts/results/playwright-console.log

      - name: Crear resumen de la batida
        if: always()
        shell: bash
        run: |
          {
            echo "# RUANA QA manual"
            echo
            echo "- Rama/commit: $GITHUB_REF_NAME / $GITHUB_SHA"
            echo "- Ejecucion: $GITHUB_RUN_NUMBER"
            echo "- BBDD: SQLite temporal local del runner"
            echo "- Reporte HTML: qa-artifacts/playwright-report/index.html"
            echo "- Videos: qa-artifacts/test-results/**/video.webm"
            echo
            echo "El runner se destruye al finalizar; no quedan datos de prueba persistidos."
          } > qa-artifacts/README_QA.md

      - name: Borrar artefacto QA anterior
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const artifactName = 'ruana-qa-latest';
            const { owner, repo } = context.repo;
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
              owner,
              repo,
              per_page: 100,
            });

            for (const artifact of artifacts.filter((item) => item.name === artifactName)) {
              await github.rest.actions.deleteArtifact({
                owner,
                repo,
                artifact_id: artifact.id,
              });
            }

      - name: Subir ultima batida QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruana-qa-latest
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 1
